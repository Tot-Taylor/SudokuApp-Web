name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps --only-shell chromium webkit
      - run: npx playwright test
      - run: npm run release -- "$(git rev-parse --short=12 HEAD)"
